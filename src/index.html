<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>我的待办清单</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #6a5acd, #4834d4);
    min-height: 100vh;
    padding: 20px 16px 80px;
    color: #fff;
  }
  .header {
    text-align: center;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 26px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #todoInput {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    background: rgba(255,255,255,0.95);
    color: #333;
    outline: none;
  }
  #addBtn {
    padding: 0 22px;
    border: none;
    border-radius: 12px;
    background: #ffd166;
    color: #4a3b00;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }

  .stats {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 10px;
  }

  #list { list-style: none; }
  #list li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  #list li.done .text {
    text-decoration: line-through;
    color: #999;
  }
  .check {
    width: 24px; height: 24px;
    border: 2px solid #6a5acd;
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .done .check {
    background: #6a5acd;
  }
  .check::after {
    content: "";
    width: 8px; height: 14px;
    border: 2px solid #fff;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
    display: none;
    margin: -4px 2px 0 0;
  }
  .done .check::after { display: block; }
  .text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  .del {
    background: #ffe5e5;
    color: #d33;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .empty {
    text-align: center;
    opacity: 0.7;
    font-size: 14px;
    padding: 30px 0;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>我的待办清单</h1>
    <p id="subtitle">今天也要加油哦</p>
  </div>

  <div class="input-row">
    <input id="todoInput" type="text" placeholder="写下要做的事…" />
    <button id="addBtn">＋</button>
  </div>

  <div class="stats" id="stats">共 0 项</div>

  <ul id="list"></ul>

<script>
  const KEY = "todos_v1";
  let todos = [];

  const input = document.getElementById("todoInput");
  const addBtn = document.getElementById("addBtn");
  const listEl = document.getElementById("list");
  const statsEl = document.getElementById("stats");

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      todos = raw ? JSON.parse(raw) : [];
    } catch (e) { todos = []; }
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(todos));
  }
  function render() {
    listEl.innerHTML = "";
    if (todos.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.style.background = "transparent";
      li.style.boxShadow = "none";
      li.textContent = "还没有待办事项，添加一个吧 ✨";
      listEl.appendChild(li);
    } else {
      todos.forEach((t, i) => {
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");

        const check = document.createElement("div");
        check.className = "check";
        check.onclick = () => {
          todos[i].done = !todos[i].done;
          save();
          render();
        };

        const text = document.createElement("div");
        text.className = "text";
        text.textContent = t.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "删除";
        del.onclick = () => {
          todos.splice(i, 1);
          save();
          render();
        };

        li.appendChild(check);
        li.appendChild(text);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }
    const done = todos.filter(t => t.done).length;
    statsEl.textContent = todos.length === 0
      ? "共 0 项"
      : `共 ${todos.length} 项，已完成 ${done} 项`;
  }

  function addTodo() {
    const v = input.value.trim();
    if (!v) return;
    todos.push({ text: v, done: false });
    input.value = "";
    save();
    render();
  }

  addBtn.onclick = addTodo;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") addTodo();
  });

  load();
  render();
</script>
</body>
</html>
