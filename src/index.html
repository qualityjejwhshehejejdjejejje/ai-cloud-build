<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }
        .calculator {
            width: 100%;
            max-width: 400px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }
        .display {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .expression {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-bottom: 8px;
            min-height: 20px;
            word-wrap: break-word;
        }
        .result {
            color: #ffffff;
            font-size: 36px;
            font-weight: 300;
            word-wrap: break-word;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 20px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.2);
        }
        .btn.operator {
            background: rgba(102,178,255,0.3);
            color: #66b3ff;
        }
        .btn.operator:active {
            background: rgba(102,178,255,0.5);
        }
        .btn.equals {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn.equals:active {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4595 100%);
        }
        .btn.clear {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
        }
        .btn.clear:active {
            background: rgba(255,107,107,0.4);
        }
        .btn.delete {
            background: rgba(255,193,7,0.2);
            color: #ffc107;
        }
        .btn.delete:active {
            background: rgba(255,193,7,0.4);
        }
        .history {
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: none;
        }
        .history-item {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 4px;
            text-align: right;
            word-wrap: break-word;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .history-header span {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }
        .clear-history {
            background: none;
            border: none;
            color: rgba(255,107,107,0.6);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .clear-history:active {
            background: rgba(255,107,107,0.1);
        }
        .toggle-history {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            cursor: pointer;
            padding: 4px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="history" id="history"></div>
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <button class="btn clear" onclick="clearAll()">C</button>
            <button class="btn delete" onclick="deleteLast()">⌫</button>
            <button class="btn operator" onclick="press('(')">(</button>
            <button class="btn operator" onclick="press(')')">)</button>

            <button class="btn" onclick="press('7')">7</button>
            <button class="btn" onclick="press('8')">8</button>
            <button class="btn" onclick="press('9')">9</button>
            <button class="btn operator" onclick="press('/')">÷</button>

            <button class="btn" onclick="press('4')">4</button>
            <button class="btn" onclick="press('5')">5</button>
            <button class="btn" onclick="press('6')">6</button>
            <button class="btn operator" onclick="press('*')">×</button>

            <button class="btn" onclick="press('1')">1</button>
            <button class="btn" onclick="press('2')">2</button>
            <button class="btn" onclick="press('3')">3</button>
            <button class="btn operator" onclick="press('-')">−</button>

            <button class="btn" onclick="press('0')">0</button>
            <button class="btn" onclick="press('.')">.</button>
            <button class="btn operator" onclick="press('+')">+</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let expression = '';
        let lastResult = '';
        let justCalculated = false;
        let history = [];

        const resultEl = document.getElementById('result');
        const expressionEl = document.getElementById('expression');
        const historyEl = document.getElementById('history');

        function press(char) {
            if (justCalculated && !isNaN(char)) {
                expression = '';
                justCalculated = false;
            }
            expression += char;
            expressionEl.textContent = expression;
            resultEl.textContent = '0';
        }

        function calculate() {
            if (!expression.trim()) return;
            try {
                let safeExpression = expression.replace(/\//g, '/').replace(/\*/g, '*');
                let result = Function('"use strict"; return (' + safeExpression + ')')();
                
                if (typeof result !== 'number' || isNaN(result) || !isFinite(result)) {
                    resultEl.textContent = '错误';
                    expression = '';
                    expressionEl.textContent = '';
                    justCalculated = false;
                    return;
                }

                // 格式化结果
                let displayResult = formatNumber(result);
                
                // 添加到历史
                let historyEntry = expression + ' = ' + displayResult;
                history.unshift(historyEntry);
                if (history.length > 10) history.pop();
                renderHistory();

                lastResult = displayResult;
                expressionEl.textContent = expression + ' =';
                resultEl.textContent = displayResult;
                expression = '';
                justCalculated = true;

            } catch (e) {
                resultEl.textContent = '错误';
                expression = '';
                expressionEl.textContent = '';
                justCalculated = false;
            }
        }

        function formatNumber(num) {
            if (num === 0) return '0';
            // 如果数字太大或太小，用科学计数法
            if (Math.abs(num) >= 1e15 || (Math.abs(num) < 1e-10 && num !== 0)) {
                return num.toExponential(8).replace(/\.?0+e/, 'e');
            }
            // 处理浮点精度问题
            let str = parseFloat(num.toPrecision(12)).toString();
            if (str.length > 15) {
                str = parseFloat(num.toPrecision(10)).toString();
            }
            return str;
        }

        function clearAll() {
            expression = '';
            lastResult = '';
            justCalculated = false;
            expressionEl.textContent = '';
            resultEl.textContent = '0';
        }

        function deleteLast() {
            if (justCalculated) {
                clearAll();
                return;
            }
            expression = expression.slice(0, -1);
            expressionEl.textContent = expression;
            resultEl.textContent = '0';
        }

        function renderHistory() {
            if (history.length === 0) {
                historyEl.style.display = 'none';
                historyEl.innerHTML = '';
                return;
            }
            historyEl.style.display = 'block';
            let html = '<div class="history-header"><span>历史</span><button class="clear-history" onclick="clearHistory()">清除</button></div>';
            for (let i = 0; i < history.length; i++) {
                html += '<div class="history-item" onclick="useHistory(' + i + ')">' + history[i] + '</div>';
            }
            historyEl.innerHTML = html;
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        function useHistory(index) {
            let entry = history[index];
            let parts = entry.split('=');
            if (parts.length >= 2) {
                let resultStr = parts[1].trim();
                if (!isNaN(resultStr)) {
                    expression = resultStr;
                    justCalculated = false;
                    expressionEl.textContent = resultStr;
                    resultEl.textContent = '0';
                }
            }
        }
    </script>
</body>
</html>
